# ros_gz_bridge configuration for PushBot.
# Each entry connects one Gazebo topic to one ROS 2 topic.
#
# Only the clock and sensors cross the bridge. Driving, odometry, TF and
# joint states are handled by ros2_control, which already talks ROS.
#
# List Gazebo topics with:  gz topic -l
# List ROS topics with:     ros2 topic list

# Simulation time. Every ROS node launched with use_sim_time:=true reads this.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# LiDAR scans
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
